; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; A single firmware build covers all hardware variants (Victron, DALY BMS,
; HighSide/24V, 4-20mA level sensor, flow sensor). Every feature is enabled
; or disabled at runtime via the WiFi configuration portal (see README) —
; separate build-time variants are not needed, since the very first boot
; (empty NVS) always opens the portal anyway.

[env:heltec_v3]
; espressif32 @ 6.4.0  → ESP-IDF v4.4  (PCNT: driver/pcnt.h)
; pioarduino            → ESP-IDF v5.x  (PCNT: driver/pulse_cnt.h)
platform = espressif32 @ 6.4.0
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip

board         = heltec_wifi_lora_32_V3
framework     = arduino
monitor_speed = 115200

extra_scripts =
    pre:tools/version.py

lib_deps =
    jgromes/RadioLib @ ^7.6.0
    ropg/Heltec_Esp32_LoRa_v3 @ ^0.9.2
    tzapu/WiFiManager @ ^2.0.16-rc.2
    electroniccats/CayenneLPP @ ^1.6.1
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.16.1
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.6
    https://github.com/maland16/daly-bms-uart
    https://github.com/cterwilliger/VeDirectFrameHandler
